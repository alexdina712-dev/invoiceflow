packages:
  - '.'
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

# Patched transitive dependencies used by Prisma's configuration loader.
overrides:
  effect: 3.20.0
  deepmerge-ts: 8.0.0
